---
- name: Deploy Holiday Events application
  hosts: target
  become: true
  vars:
    docker_image: "idannadler/holyday-mission:latest"
    container_name: "holyday-mission"
    app_port: 3000

  tasks:

    - name: Pull the latest Docker image
      command: docker pull {{ docker_image }}
      register: pull_result
      changed_when: "'Downloaded newer image' in pull_result.stdout or 'Status: Downloaded' in pull_result.stdout"

    - name: Stop existing container if running
      command: docker stop {{ container_name }}
      register: stop_result
      failed_when: false
      changed_when: stop_result.rc == 0

    - name: Remove existing container if present
      command: docker rm {{ container_name }}
      register: rm_result
      failed_when: false
      changed_when: rm_result.rc == 0

    - name: Run new container
      command: >
        docker run -d
        --name {{ container_name }}
        -p {{ app_port }}:{{ app_port }}
        --restart unless-stopped
        {{ docker_image }}
      register: run_result

    - name: Wait a few seconds for the app to start
      pause:
        seconds: 5

        - name: Verify the application responds
      uri:
        url: "http://localhost:{{ app_port }}/health"
        status_code: 200
        return_content: yes
      register: health_check
      retries: 5
      delay: 3
      until: health_check.status == 200

    - name: Confirm health check reports healthy status
      assert:
        that:
          - "'healthy' in health_check.content"
        fail_msg: "Health check did not report a healthy status"
        success_msg: "Health check confirmed the application is healthy"

    - name: Show health check result
      debug:
        msg: "Application is up and healthy on port {{ app_port }} ({{ health_check.content }})"



        