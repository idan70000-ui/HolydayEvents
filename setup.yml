---
- name: Prepare target server for Docker deployments
  hosts: target
  become: true
  tasks:

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install prerequisite packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    - name: Install Docker
      apt:
        name: docker.io
        state: present

    - name: Check if Docker daemon is already running
      command: pgrep dockerd
      register: docker_running
      failed_when: false
      changed_when: false

    - name: Start Docker daemon in background if not running
      shell: nohup dockerd > /var/log/dockerd.log 2>&1 &
      when: docker_running.rc != 0

    - name: Wait for Docker socket to be ready
      wait_for:
        path: /var/run/docker.sock
        timeout: 30